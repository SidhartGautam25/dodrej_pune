<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer Ring (Ink Stamp style) -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#b91c1c" stroke-width="5" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="#b91c1c" stroke-width="1.5" />
  
  <!-- Solid white inner circle -->
  <circle cx="100" cy="100" r="83" fill="#ffffff" />
  
  <!-- Dashed Ring inside -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3.5" />
  
  <!-- Paths for curved text -->
  <path id="curve-top" d="M 32,100 A 68,68 0 0,1 168,100" fill="none" />
  <path id="curve-bottom" d="M 168,100 A 68,68 0 0,1 32,100" fill="none" />
  
  <text fill="#b91c1c" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2">
    <textPath href="#curve-top" startOffset="50%" text-anchor="middle">NEW LAUNCH</textPath>
  </text>
  
  <text fill="#b91c1c" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="900" letter-spacing="1.5">
    <textPath href="#curve-bottom" startOffset="50%" text-anchor="middle">PREMIUM PROJECT</textPath>
  </text>
  
  <!-- 3 Stars Top -->
  <g fill="#b91c1c">
    <polygon points="100,58 102,62 106,62 103,65 104,69 100,67 96,69 97,65 94,62 98,62" />
    <polygon points="85,60 87,64 91,64 88,67 89,71 85,69 81,71 82,67 79,64 83,64" />
    <polygon points="115,60 117,64 121,64 118,67 119,71 115,69 111,71 112,67 109,64 113,64" />
  </g>
  
  <!-- 3 Stars Bottom -->
  <g fill="#b91c1c">
    <polygon points="100,131 102,135 106,135 103,138 104,142 100,140 96,142 97,138 94,135 98,135" />
    <polygon points="85,129 87,133 91,133 88,136 89,140 85,138 81,140 82,136 79,133 83,133" />
    <polygon points="115,129 117,133 121,133 118,136 119,140 115,138 111,140 112,136 109,133 113,133" />
  </g>
  
  <!-- Diagonal banner in the middle (rotated) -->
  <g transform="rotate(-11, 100, 100)">
    <rect x="-5" y="81" width="210" height="38" rx="6" fill="#b91c1c" stroke="#ffffff" stroke-width="2.5" />
    <rect x="-2" y="84" width="204" height="32" rx="4" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6" />
    <text x="100" y="108" fill="#ffffff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">
      NEW LAUNCH
    </text>
  </g>
</svg>
