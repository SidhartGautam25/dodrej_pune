version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: godrej-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: godrej
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: godrej-web-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/godrej?schema=public"
      NODE_ENV: "production"
    depends_on:
      - db
    volumes:
      # Mount public directory to persist uploads across container restarts if needed,
      # but we can let them write directly.
      - uploads_data:/app/public/uploads

volumes:
  postgres_data:
  uploads_data:
